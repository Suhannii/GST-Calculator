        /* === GLASSMORPHISM REDESIGN v2 (CURVIER) === */

        :root {
            --primary-color: #6366F1; /* Indigo 500 */
            --primary-light: #e0e7ff; /* Indigo 100 */
            --text-light: #f3f4f6; /* Gray 100 */
            --text-medium: #d1d5db; /* Gray 300 */
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(255, 255, 255, 0.1);
            --error-color: #F87171; /* Red 400 */
            --warning-color: #FBBF24; /* Amber 400 */
            --success-color: #34D399; /* Green 400 */
        }

        /* 1. Colourful Background */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--text-light);
            background: linear-gradient(135deg, #4f0080, #002c8a, #008080, #800040);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {

                        </div>
                        <div>

                            <input type="email" id="customerEmail" placeholder="Email Address" class="input-field">
                        </div>
                        <div>
                            <label for="customerAddress">Billing Address</label>
                            <input type="text" id="customerAddress" placeholder="Billing Address" class="input-field">
                        </div>
                    </div>
                    
                    <div class="info-box">
                        Invoice ID: <span id="invoiceIdDisplay">INV-XXXX</span>

            100% { background-position: 0% 50%; }
        }

        /* === PRINT FIX === */
            #customerInputCard, #addItemCard, #addCategoryCard, .summary-print-btn, #messageBox { 
                display: none !important; 
            }
            
            header { margin-bottom: 1rem; text-align: left; }
            header h1, header p, h1 span { 
                color: black !important;
                background: none !important;
                box-shadow: none !important;
                justify-content: flex-start; 
            }
            header h1 { font-size: 1.5rem; }
            .main-grid { grid-template-columns: 1fr; gap: 0; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Utility Classes */
        .mt-4 { margin-top: 1rem; }
        .space-y-8 > * + * { margin-top: 2rem; }
        
        /* Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
        

        /* Header */
        header { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 span {
            background-color: var(--primary-color);
            color: white;
            border-radius: 9999px;
            padding: 0.5rem;
            margin-right: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        header p { color: var(--text-medium); margin-top: 0.5rem; }
        

         /* 2. Glass Cards (NOW CURVIER) */
        .card, .summary-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 1.25rem; /* Increased curve */
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        .card-primary {
            border-top: none;
        }

        /* 3. Light Text & Inputs (NOW CURVIER) */
        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: end; /* This aligns all grid items to the bottom */
        }
        @media (min-width: 768px) {
            .input-group-2-col { grid-template-columns: repeat(2, 1fr); }
            .input-group-3-col { grid-template-columns: repeat(3, 1fr); }
            .input-group-5-col { grid-template-columns: repeat(5, 1fr); }
            .span-2-col { grid-column: span 2; }
            .span-1-col-lg { grid-column: span 1; }
        }

        /* === ALIGNMENT FIX === 
           This new class makes the button's container stretch
           so it can align its content (the button) properly.
        */
        .btn-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem; /* Increased curve */
            transition: all 0.15s ease-in-out;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            box-sizing: border-box; /* Fixes padding issue */
        }
        .input-field::placeholder {
            color: var(--text-medium);
        }
        .input-field:focus, .select-field:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        .select-field option {
            background: #2d3748;
            color: #ffffff;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-medium);
            margin-bottom: 0.25rem;
        }
        
        /* Buttons (NOW CURVIER) */
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem ;
            border-radius: 0.75rem; /* Increased curve */
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            width: 100%;
            box-shadow: 0 4px 15px -3px rgb(0, 251, 255);
        }
        .btn-primary:hover {
            background-color: #4f46e5;
            box-shadow: 0 9px 20px -3px rgba(255, 0, 225, 0.809);
            transform: translateY(-2px);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Invoice Summary Box */
        .info-box {
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--input-bg);
            border-radius: 0.75rem; /* Increased curve */
            font-size: 0.875rem;
            color: var(--text-light);
            border: 1px solid var(--glass-border);
        }
        .info-box span { font-weight: 600; font-family: monospace; color: #ffffff; }
        
        /* Item Table */
        .item-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        .item-table th, .item-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        .item-table th {
            background: transparent;
            font-weight: 600;
            color: var(--text-medium);
            font-size: 0.875rem;
            text-transform: uppercase;
        }
        .item-table td:last-child, .item-table th:last-child { text-align: right; }

        /* Delete button style */
        .btn-delete {
            background: none;
            border: none;
            color: var(--text-medium);
            cursor: pointer;
            font-weight: 600;
            padding: 0;
            font-size: 1.1rem;
            transition: color 0.1s;
        }
        .btn-delete:hover { 
            color: var(--error-color); 
        }
        
        /* Summary Panel (Sidebar) */
        .summary-panel {
            position: sticky;
            top: 2rem;
            align-self: start;
        }
        .summary-panel h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .summary-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
            color: var(--text-light);
        }
        .summary-detail strong { font-weight: 600; color: #ffffff; }
        .summary-total {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--glass-border);
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
        }
        .summary-total span { color: var(--primary-color); }
        .summary-print-btn {
            margin-top: 2rem;
        }
        /* Loading/Error Message (NOW CURVIER) */
        #messageBox {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem;
            border-radius: 0.75rem; /* Increased curve */
            color: white;
            z-index: 1000;
            display: none;
            font-weight: 600;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .msg-loading { background-color: var(--warning-color); color: #1f2937; }
        .msg-error { background-color: var(--error-color); }
        .msg-success { background-color: var(--success-color); color: #1f2937; }

        /* --- Print Styles (FIXED) --- */
        #customerInfoPrint {
            display: none;
        }
        
        @media print {
            body { 
                background: white !important; 
                padding: 1rem;
                color: black !important; 
            }
            .container { max-width: none; margin: 0; }

            /* Reset card and panel styles */
            .card, .summary-panel {
                background: white !important;
                color: black !important;
                box-shadow: none !important;
                border: none !important;
                backdrop-filter: none !important;
                position: static !important;
                padding: 0 !important;
            }

            #customerInfoPrint { 
                display: block !important;
                margin-top: 1.5rem; 
                margin-bottom: 2rem; 
                padding-bottom: 1rem; 
                border-bottom: 1px solid #ccc;
                line-height: 1.5;
                font-size: 1rem;
                color: black !important;
            }
            #customerInfoPrint div { 
                margin-top: 0.25rem; 
                color: #333 !important;
                display: flex;
            }
            #customerInfoPrint strong {
                font-weight: 600;
                color: black !important;
                width: 120px;
                flex-shrink: 0;
            }
            
            .summary-panel {
                border-top: 1px solid #ccc;
                padding-top: 1.5rem !important;
            }
            .summary-panel h2, .summary-detail, .summary-detail strong, .summary-total, .summary-total span {
                color: black !important;
            }
            .summary-panel h2 { font-size: 1.25rem; border: none; }

            /* === PRINT FIX === */
            #invoiceItemsCard {
                display: block !important;
            }
            #itemListContainer { 
                display: block !important;
                margin-top: 0;
            }
            .invoice-items-print-header {
                display: block !important;
                font-size: 1.5rem;
                font-weight: 800;
                margin-bottom: 0.5rem;
                color: black !important;
            }
            .item-table th, .item-table td { 
                border-bottom: 1px solid #ccc;
                color: black !important;
                background: none !important;
            }
            .item-table th { background-color: #f3f4f6 !important; }
            
            .item-table th:last-child, .item-table td:last-child {
                display: none;
            }
        }
    </style>
</head>
