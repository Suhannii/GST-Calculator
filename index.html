<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern GST Invoice Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* === GLASSMORPHISM REDESIGN v2 (CURVIER) === */

        :root {
            --primary-color: #6366F1; /* Indigo 500 */
            --primary-light: #e0e7ff; /* Indigo 100 */
            --text-light: #f3f4f6; /* Gray 100 */
            --text-medium: #d1d5db; /* Gray 300 */
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(255, 255, 255, 0.1);
            --error-color: #F87171; /* Red 400 */
            --warning-color: #FBBF24; /* Amber 400 */
            --success-color: #34D399; /* Green 400 */
        }

        /* 1. Colourful Background */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--text-light);
            background: linear-gradient(135deg, #4f0080, #002c8a, #008080, #800040);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Utility Classes */
        .mt-4 { margin-top: 1rem; }
        .space-y-8 > * + * { margin-top: 2rem; }
        
        /* Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
        

        /* Header */
        header { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 span {
            background-color: var(--primary-color);
            color: white;
            border-radius: 9999px;
            padding: 0.5rem;
            margin-right: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        header p { color: var(--text-medium); margin-top: 0.5rem; }
